<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="760" height="470" fill="#0d1117"/>

  <text x="30" y="34" fill="#e6edf3" font-size="15" font-weight="bold">LunAIR request flow</text>
  <text x="30" y="54" fill="#8b949e" font-size="11">Client → Go gateway → FastAPI core → providers</text>

  <!-- Client -->
  <rect x="30" y="80" width="120" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="103" fill="#e6edf3" font-size="12" text-anchor="middle">Client</text>
  <text x="90" y="120" fill="#8b949e" font-size="10" text-anchor="middle">OpenAI SDK</text>

  <line x1="150" y1="107" x2="196" y2="107" stroke="#58a6ff" stroke-width="1.5"/>
  <path d="M196 107 l-6 -4 l0 8 z" fill="#58a6ff"/>
  <text x="173" y="99" fill="#8b949e" font-size="9" text-anchor="middle">POST</text>

  <!-- Gateway -->
  <rect x="200" y="72" width="170" height="152" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="285" y="94" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Go Gateway :8080</text>
  <line x1="216" y1="102" x2="354" y2="102" stroke="#30363d"/>
  <text x="216" y="120" fill="#e6edf3" font-size="10">ReverseProxy</text>
  <text x="216" y="134" fill="#8b949e" font-size="9">FlushInterval -1 (SSE)</text>
  <text x="216" y="156" fill="#e6edf3" font-size="10">Injects trusted headers</text>
  <text x="216" y="170" fill="#8b949e" font-size="9">X-LUNAIR-Verified: true</text>
  <text x="216" y="182" fill="#8b949e" font-size="9">X-LUNAIR-Key-Id</text>
  <text x="216" y="204" fill="#e6edf3" font-size="10">/health  /metrics</text>

  <line x1="370" y1="148" x2="416" y2="148" stroke="#d29922" stroke-width="1.5"/>
  <path d="M416 148 l-6 -4 l0 8 z" fill="#d29922"/>
  <text x="393" y="140" fill="#8b949e" font-size="9" text-anchor="middle">HTTP</text>

  <!-- FastAPI -->
  <rect x="420" y="72" width="180" height="152" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="510" y="94" fill="#d29922" font-size="12" font-weight="bold" text-anchor="middle">FastAPI Core :8000</text>
  <line x1="436" y1="102" x2="584" y2="102" stroke="#30363d"/>
  <text x="436" y="120" fill="#e6edf3" font-size="10">Trust middleware</text>
  <text x="436" y="140" fill="#e6edf3" font-size="10">Credential preflight</text>
  <text x="436" y="160" fill="#e6edf3" font-size="10">resolve_intent (auto/*)</text>
  <text x="436" y="180" fill="#e6edf3" font-size="10">LiteLLM router + fallback</text>
  <text x="436" y="200" fill="#e6edf3" font-size="10">Log request → Postgres</text>

  <!-- Providers -->
  <line x1="510" y1="224" x2="510" y2="266" stroke="#58a6ff" stroke-width="1.5"/>
  <path d="M510 266 l-4 -6 l8 0 z" fill="#58a6ff"/>
  <text x="524" y="250" fill="#8b949e" font-size="9">LiteLLM</text>

  <rect x="300" y="274" width="140" height="40" rx="6" fill="#161b22" stroke="#bc8cff"/>
  <text x="370" y="299" fill="#bc8cff" font-size="11" text-anchor="middle">OpenAI</text>
  <rect x="452" y="274" width="140" height="40" rx="6" fill="#161b22" stroke="#bc8cff"/>
  <text x="522" y="299" fill="#bc8cff" font-size="11" text-anchor="middle">Gemini</text>
  <rect x="604" y="274" width="126" height="40" rx="6" fill="#161b22" stroke="#bc8cff"/>
  <text x="667" y="299" fill="#bc8cff" font-size="11" text-anchor="middle">Groq</text>

  <line x1="510" y1="266" x2="370" y2="274" stroke="#30363d"/>
  <line x1="510" y1="266" x2="522" y2="274" stroke="#30363d"/>
  <line x1="510" y1="266" x2="667" y2="274" stroke="#30363d"/>

  <!-- Data stores -->
  <rect x="30" y="352" width="290" height="88" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="46" y="374" fill="#f85149" font-size="12" font-weight="bold">PostgreSQL 16</text>
  <text x="46" y="394" fill="#e6edf3" font-size="10">requests — partitioned monthly</text>
  <text x="46" y="410" fill="#e6edf3" font-size="10">api_keys, pii_events, injection_events</text>
  <text x="46" y="426" fill="#8b949e" font-size="9">balance_snapshots, budgets</text>

  <rect x="340" y="352" width="390" height="88" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="356" y="374" fill="#f85149" font-size="12" font-weight="bold">Redis 7</text>
  <text x="356" y="394" fill="#e6edf3" font-size="10">Gateway pings on boot (warns if absent)</text>
  <text x="356" y="410" fill="#e6edf3" font-size="10">Reserved: rate limiter + semantic cache (Phase 2)</text>

  <line x1="510" y1="330" x2="175" y2="350" stroke="#30363d" stroke-dasharray="3 3"/>
  <line x1="535" y1="352" x2="535" y2="352" stroke="#30363d"/>

  <text x="30" y="458" fill="#8b949e" font-size="9">Phase 1 verified — Phase 2 (PII, injection, cache, rate limit) planned in PLAN.md</text>
</svg>