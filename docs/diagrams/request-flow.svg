<svg xmlns="http://www.w3.org/2000/svg" width="620" height="660" viewBox="0 0 620 660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="620" height="660" fill="#0d1117"/>

  <text x="30" y="34" fill="#e6edf3" font-size="15" font-weight="bold">Request lifecycle (GATEWAY_MODE=go)</text>
  <text x="30" y="54" fill="#8b949e" font-size="11">Numbered steps through both layers</text>

  <!-- Steps -->
  <g font-size="11">
    <!-- 1 -->
    <circle cx="46" cy="92" r="13" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="46" y="96" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">1</text>
    <text x="72" y="90" fill="#e6edf3">Client POSTs OpenAI body</text>
    <text x="72" y="105" fill="#8b949e" font-size="10">→ :8080/v1/chat/completions</text>
    <line x1="46" y1="105" x2="46" y2="126" stroke="#30363d"/>

    <!-- 2 -->
    <circle cx="46" cy="139" r="13" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="46" y="143" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">2</text>
    <text x="72" y="137" fill="#e6edf3">Gateway injects trusted headers</text>
    <text x="72" y="152" fill="#8b949e" font-size="10">X-LUNAIR-Verified: true, X-LUNAIR-Key-Id</text>
    <line x1="46" y1="152" x2="46" y2="173" stroke="#30363d"/>

    <!-- 3 -->
    <circle cx="46" cy="186" r="13" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="46" y="190" fill="#d29922" font-size="11" text-anchor="middle" font-weight="bold">3</text>
    <text x="72" y="184" fill="#e6edf3">Trust middleware sees verified header</text>
    <text x="72" y="199" fill="#8b949e" font-size="10">skips Bearer lookup; direct calls → 401</text>
    <line x1="46" y1="199" x2="46" y2="220" stroke="#30363d"/>

    <!-- 4 -->
    <circle cx="46" cy="233" r="13" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="46" y="237" fill="#d29922" font-size="11" text-anchor="middle" font-weight="bold">4</text>
    <text x="72" y="231" fill="#e6edf3">Credential preflight</text>
    <text x="72" y="246" fill="#8b949e" font-size="10">drops placeholder-key providers</text>
    <rect x="400" y="218" width="180" height="28" rx="4" fill="#1c1410" stroke="#8b949e"/>
    <text x="410" y="236" fill="#f85149" font-size="10">none left → 503, names env vars</text>
    <line x1="46" y1="246" x2="46" y2="267" stroke="#30363d"/>

    <!-- 5 -->
    <circle cx="46" cy="280" r="13" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="46" y="284" fill="#d29922" font-size="11" text-anchor="middle" font-weight="bold">5</text>
    <text x="72" y="278" fill="#e6edf3">resolve_intent expands auto/*</text>
    <text x="72" y="293" fill="#8b949e" font-size="10">auto/cheap → gemini, gpt-4o-mini</text>
    <line x1="46" y1="293" x2="46" y2="314" stroke="#30363d"/>

    <!-- 6 -->
    <circle cx="46" cy="327" r="13" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="46" y="331" fill="#d29922" font-size="11" text-anchor="middle" font-weight="bold">6</text>
    <text x="72" y="325" fill="#e6edf3">Try candidates in priority order</text>
    <text x="72" y="340" fill="#8b949e" font-size="10">first success wins; records fallback_from</text>
    <rect x="400" y="312" width="180" height="28" rx="4" fill="#1c1410" stroke="#8b949e"/>
    <text x="410" y="330" fill="#f85149" font-size="10">all failed → 502, truncated error</text>
    <line x1="46" y1="340" x2="46" y2="361" stroke="#30363d"/>

    <!-- 7 -->
    <circle cx="46" cy="374" r="13" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="46" y="378" fill="#bc8cff" font-size="11" text-anchor="middle" font-weight="bold">7</text>
    <text x="72" y="372" fill="#e6edf3">Provider returns completion</text>
    <text x="72" y="387" fill="#8b949e" font-size="10">OpenAI / Gemini / Groq</text>
    <line x1="46" y1="387" x2="46" y2="408" stroke="#30363d"/>

    <!-- 8 -->
    <circle cx="46" cy="421" r="13" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="46" y="425" fill="#bc8cff" font-size="11" text-anchor="middle" font-weight="bold">8</text>
    <text x="72" y="419" fill="#e6edf3">Log request row</text>
    <text x="72" y="434" fill="#8b949e" font-size="10">provider, tokens, cost, latency</text>
    <text x="72" y="449" fill="#8b949e" font-size="10">failures swallowed — analytics never break a call</text>
    <line x1="46" y1="449" x2="46" y2="470" stroke="#30363d"/>

    <!-- 9 -->
    <circle cx="46" cy="483" r="13" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="46" y="487" fill="#58a6ff" font-size="11" text-anchor="middle" font-weight="bold">9</text>
    <text x="72" y="481" fill="#e6edf3">Response back through the gateway</text>
    <text x="72" y="496" fill="#8b949e" font-size="10">X-LUNAIR-Provider / -Model / -Cost-USD</text>
    <text x="72" y="511" fill="#8b949e" font-size="10">SSE stays unbuffered (FlushInterval -1)</text>
  </g>

  <line x1="30" y1="530" x2="590" y2="530" stroke="#30363d"/>

  <text x="30" y="552" fill="#e6edf3" font-size="12" font-weight="bold">fastapi_only mode</text>
  <text x="30" y="572" fill="#8b949e" font-size="10">Client → :8000 → providers. Steps 1–2 skipped.</text>
  <text x="30" y="588" fill="#8b949e" font-size="10">Bearer key required. Gateway not started (compose profile).</text>

  <text x="30" y="626" fill="#8b949e" font-size="9">Auth: gateway header is a claim, not proof — keep :8000 internal. See docs/security.md</text>
</svg>