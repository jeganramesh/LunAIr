[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunair"
version = "0.2.0"
description = "LLM Unified Native AI Inference Router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<0.116",
    "uvicorn[standard]>=0.28.0,<1.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "httpx>=0.27.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.1,<2.0",
    "litellm>=1.35.0,<2.0",
    "redis>=5.0.0,<7.0",
    "prometheus-client>=0.20.0,<1.0",
    "prometheus-fastapi-instrumentator>=6.1.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-mock>=3.12.0,<4.0",
    "ruff>=0.3.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
