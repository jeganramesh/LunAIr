name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret committed and later removed is still found.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fails the job rather than posting a comment.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  audit:
    name: dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pip-audit
        run: |
          pip install --upgrade pip-audit
          pip-audit -r <(python - <<'PY'
          import tomllib
          with open("app/pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          for dep in data["project"]["dependencies"]:
              print(dep.split(">=")[0].split("==")[0].strip())
          PY
          )

      - name: govulncheck
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: npm audit
        working-directory: dashboard
        run: npm audit --audit-level=high

  env-hygiene:
    name: .env not committed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert .env is untracked
        run: |
          if git log --all --name-only --pretty=format: | grep -qE '^\.env$'; then
            echo "::error::.env appears in git history"
            exit 1
          fi
          if [ -e .env ]; then
            echo "::error::.env exists in the working tree"
            exit 1
          fi
          echo ".env is absent from history and the working tree"

      - name: Assert .env.example has placeholders only
        run: |
          if grep -nE '^(OPENAI|GEMINI|GROQ)_API_KEY=sk-[A-Za-z0-9]{20,}' .env.example; then
            echo "::error::.env.example contains what looks like a real key"
            exit 1
          fi
          grep -q 'REPLACE_ME' .env.example