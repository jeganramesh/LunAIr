gateway:
  mode: "go"                    # "go" (production) or "fastapi_only" (dev)
  fastapi_url: "http://localhost:8000"
  listen_port: 8080
  rate_limit:
    rpm_per_key: 60
    tpm_per_key: 100000
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 60

# --- Endpoint registry (two-layer routing) -------------------------------
# A model may be served by several endpoints; routing picks one per request.
models:
  gpt-4o-mini:
    endpoints:
      - provider: openai
        model: openai/gpt-4o-mini
        price_in: 0.15          # USD per 1M prompt tokens
        price_out: 0.60
        context: 128000
        api_key: os.environ/OPENAI_API_KEY
  gemini-2.0-flash:
    endpoints:
      - provider: gemini
        model: gemini/gemini-2.0-flash
        price_in: 0.10
        price_out: 0.40
        context: 1000000
        api_key: os.environ/GEMINI_API_KEY
  groq-llama:
    endpoints:
      - provider: groq
        model: groq/llama-3.3-70b
        price_in: 0.05
        price_out: 0.08
        context: 128000
        api_key: os.environ/GROQ_API_KEY

# --- Routing policy ------------------------------------------------------
routing:
  strategy: priority            # default when no alias strategy applies
  auto_weights:                 # weights for the `auto` strategy
    cost: 0.35
    latency: 0.30
    success: 0.25
    load: 0.10
  aliases:
    auto/cheap:
      strategy: cost_optimized
      candidates: ["gemini-2.0-flash", "gpt-4o-mini"]
    auto/fast:
      strategy: latency_optimized
      candidates: ["groq-llama", "gemini-2.0-flash"]
    auto/balanced:
      strategy: auto
      candidates: ["gpt-4o-mini", "gemini-2.0-flash", "groq-llama"]

router_settings:
  fallbacks:
    - gpt-4o-mini: ["gemini-2.0-flash", "groq-llama"]

balance:
  refresh_interval_seconds: 300
  providers:
    - name: openai
      endpoint: https://api.openai.com/v1/dashboard/billing/credit_grants
    - name: openrouter
      endpoint: https://openrouter.ai/api/v1/credits
    - name: deepseek
      endpoint: https://api.deepseek.com/user/balance

budgets:
  default_monthly_usd: 50
  warn_at_pct: 80
  block_at_pct: 100

security:
  pii_redaction: true
  pii_types: ["EMAIL", "PHONE", "SSN", "CREDIT_CARD", "API_KEY"]
  provider_allowlist: ["openai", "gemini", "groq"]
  store_prompts: false
  log_retention_days: 30
  injection_detection: true
  injection_sensitivity: "high"
  injection_risk_threshold: 0.7

semantic_cache:
  enabled: true
  redis_url: os.environ/REDIS_URL
  similarity_threshold: 0.90
  ttl_seconds: 3600
  namespace: "lunair"
  exclude_agent_keys: true

compression:
  enabled: true
  mode: "lite"                  # lite (safe, always-on tier)

logging:
  store_prompts_in_spend_logs: true
